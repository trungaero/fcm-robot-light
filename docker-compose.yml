services:
  backend:
    build:
      context: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-mini}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
      OPENAI_INSTRUCTIONS: ${OPENAI_INSTRUCTIONS:-You are a friendly, concise voice assistant. Keep replies short and conversational.}
      OPENAI_SAFETY_IDENTIFIER: ${OPENAI_SAFETY_IDENTIFIER:-voice-chat-demo}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
