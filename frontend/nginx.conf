server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri /index.html;
    }

    # Proxy the signaling WebSocket to the backend.
    # The backend lives on a separate network ("another machine"), so we reach
    # it through the host's published port rather than the service name.
    location /ws {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep long-lived WebSocket connections open.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Optional: expose the backend health check through the same origin.
    location /health {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
    }
}
